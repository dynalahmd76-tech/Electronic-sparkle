/* Layout: one page, two views. Store (default): header, chips, product grid, bottom cart bar and sheet. Admin (#admin): settings, products, sticky publish bar. */
:root{

    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1514; --surface:#162120; --surface2:#1E2D2C; --fg:#E7EFEE; --muted:#93A9A8; --line:#2A3C3B;
  --accent:#4FC2B8; --accent-fg:#06201E; --gold:#E0B650; --good:#58C98A; --warn:#E5B04C; --bad:#F0806E;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--fg); font-family:var(--f-b); font-size:15px; line-height:1.65;
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 96px;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
h1,h2,h3,p{margin:0}
h1,h2,h3{text-wrap:balance}
a{color:inherit}
button,input,textarea,select{font:inherit;color:inherit}
.wrap{max-width:1080px;margin-inline:auto;min-width:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:8px;text-decoration:none;min-width:0}
.brand svg{width:18px;height:18px;align-self:center;flex:none;color:var(--gold)}
.bn{font-family:var(--f-d);font-weight:700;font-size:26px;line-height:1.1}
.bt{color:var(--muted);font-size:13px}
.ghost{font-size:13px;text-decoration:none;border:1px solid var(--line);border-radius:8px;padding:6px 12px;white-space:nowrap}
.ghost:hover{background:var(--surface2)}

.intro{padding-block:22px 6px;display:grid;gap:6px}
.intro h1{font-family:var(--f-d);font-weight:700;font-size:clamp(26px,6vw,38px);line-height:1.2}
.intro p{color:var(--muted);max-width:60ch}
.notice{margin-top:14px;padding:10px 14px;border:1px solid var(--line);border-inline-start:3px solid var(--gold);border-radius:8px;background:var(--surface)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-block:16px 4px;scrollbar-width:thin}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 14px;font-size:14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px;padding-block:14px 8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.ph{aspect-ratio:1/1;max-width:100%;background:var(--surface2);display:grid;place-items:center;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph span{font-family:var(--f-d);font-size:44px;color:var(--gold)}
.cb{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px;flex:1;min-width:0}
.cb .cat{font-size:12px;color:var(--muted)}
.cb h2{margin:0;font-size:15px;font-weight:600;line-height:1.4;overflow-wrap:anywhere}
.cb .ds{font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pr{font-weight:600;font-variant-numeric:tabular-nums;margin-top:auto;padding-top:6px}
.sold{font-size:13px;color:var(--bad);font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;cursor:pointer;text-decoration:none;font-weight:500;text-align:center}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn[disabled],.btn[aria-disabled="true"]{opacity:.5;cursor:not-allowed}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.step{display:flex;align-items:center;justify-content:space-between;border:1px solid var(--accent);border-radius:10px;overflow:hidden}
.step button{width:40px;height:36px;border:0;background:transparent;cursor:pointer;font-size:18px;color:var(--accent)}
.step b{font-variant-numeric:tabular-nums}
.empty{grid-column:1/-1;border:1px dashed var(--line);border-radius:12px;padding:40px 20px;text-align:center;display:grid;gap:6px;background:var(--surface)}
.empty b{font-family:var(--f-d);font-size:20px}
.empty span{color:var(--muted)}

.cartbar{position:fixed;left:0;right:0;bottom:0;z-index:10;padding:10px max(16px,env(safe-area-inset-left,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px));background:linear-gradient(to top,var(--bg) 60%,transparent)}
.cartbar .btn{width:100%;max-width:560px;margin-inline:auto;display:flex;justify-content:space-between;padding:13px 18px;font-size:16px}
.sheet{position:fixed;inset:0;z-index:20}
.ov{position:absolute;inset:0;background:rgba(0,0,0,.5)}
.panel{position:absolute;left:0;right:0;bottom:0;max-width:560px;margin-inline:auto;max-height:92dvh;overflow:auto;background:var(--surface);border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));display:grid;gap:14px}
.panel .hd{display:flex;align-items:center;justify-content:space-between}
.panel h2{font-family:var(--f-d);font-size:22px}
.x{border:0;background:var(--surface2);width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:18px}
.line{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;padding-block:8px;border-bottom:1px solid var(--line)}
.line .n{overflow-wrap:anywhere;font-weight:500}
.line .s{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.line .step{grid-row:1/3;grid-column:2}
.tot{display:flex;justify-content:space-between;font-weight:600;font-size:17px;font-variant-numeric:tabular-nums}
.fields{display:grid;gap:10px}
label.f{display:grid;gap:4px;font-size:13px;color:var(--muted)}
.in{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 11px;color:var(--fg)}
textarea.in{resize:vertical;min-height:64px}
.msg{font-size:13px;color:var(--bad);min-height:1.2em}
.msg.ok{color:var(--good)}
.hint{font-size:12px;color:var(--muted)}

.sec{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:12px;margin-top:16px;min-width:0}
.sec h2{font-family:var(--f-d);font-size:20px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.stat{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;display:grid}

.pill{display:inline-block;font-size:12px;padding:1px 8px;border-radius:999px;border:1px solid currentColor}

.deny{margin-top:24px;text-align:center;display:grid;gap:10px;justify-items:center}

  '<div class="acts"><button class="btn primary" data-act="saveP" id="saveP">إضافة المنتج</button><button class="btn" data-act="cancelP" id="cancelP" hidden>إلغاء التعديل</button></div></section>'+
  '<section class="sec"><h2>المنتجات</h2><div id="plist"></div></section>'+
  '<section class="sec"><h2>نشر التغييرات</h2><p class="hint">التعديلات هنا تبقى على هذا الجهاز. لتظهر للزبائن، نزّل الملفين التاليين وارفعهما إلى الاستضافة بدل القديمين.</p>'+
  '<div class="acts"><button class="btn primary" data-act="dlIndex">تنزيل index.html</button><button class="btn primary" data-act="dlData">تنزيل data.json</button></div>'+
  '<p class="hint">بعد تغيير عنوان الموقع أو لأول نشر، نزّل أيضاً:</p>'+
  '<div class="acts"><button class="btn" data-act="dlMap">تنزيل sitemap.xml</button><button class="btn" data-act="dlRobots">تنزيل robots.txt</button></div>'+
  '<p class="msg" id="dmsg" role="status"></p>'+
  '<div class="acts"><label class="btn sm" for="imp">استيراد data.json</label><input id="imp" type="file" accept="application/json,.json" hidden><button class="btn sm danger" data-act="reset">تجاهل المسودة</button></div></section>'+
  '</main>';
  $('#stName').value=draft.store.name; $('#stTag').value=draft.store.tagline; $('#stWa').value=draft.store.whatsapp||'';
  $('#stSite').value=draft.store.siteUrl||''; $('#stDesc').value=draft.store.description||''; $('#stNotice').value=draft.store.notice||'';
  bind(); renderPList(); waHint();
}
function waHint(){
  var n=normPhone(draft.store.whatsapp);
  $('#waHint').textContent=n?'سيستقبل الطلبات على الرقم الدولي: +'+n+(n.indexOf('218')===0?'':' (تأكد أنه يبدأ برمز الدولة)'):'اكتب الرقم كما تستخدمه في واتساب. الأرقام التي تبدأ بصفر تُعتبر ليبية (218).';
}
function bind(){
  var map={stName:'name',stTag:'tagline',stWa:'whatsapp',stSite:'siteUrl',stDesc:'description',stNotice:'notice'};
  Object.keys(map).forEach(function(id){$('#'+id).addEventListener('input',function(e){draft.store[map[id]]=e.target.value;waHint();saveLocal()})});
  $('#pImg').addEventListener('change',async function(e){
    var f=e.target.files&&e.target.files[0]; if(!f) return;
    var m=$('#pmsg'); m.className='msg'; m.textContent='';
    try{editImg=await shrink(f);renderImgPrev()}catch(err){m.textContent='تعذر قراءة الصورة. جرّب صورة أخرى.'}
  });
  $('#imp').addEventListener('change',async function(e){
    var f=e.target.files&&e.target.files[0]; if(!f) return;
    try{var d=JSON.parse(await f.text()); if(!valid(d)) throw 0; draft=d; saveLocal(); shell('تم استيراد الملف.')}
    catch(err){$('#dmsg').className='msg';$('#dmsg').textContent='الملف غير صالح. اختر data.json الذي نزّلته من هذه اللوحة.'}
  });
}
async function shrink(file){
  var bmp=await createImageBitmap(file), k=Math.min(1,640/Math.max(bmp.width,bmp.height));
  var c=document.createElement('canvas'); c.width=Math.max(1,Math.round(bmp.width*k)); c.height=Math.max(1,Math.round(bmp.height*k));
  c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
  return c.toDataURL('image/jpeg',0.72);
}
function renderImgPrev(){
  var d=$('#imgPrev'); d.hidden=!editImg;
  d.innerHTML=editImg?'<div class="row" style="border:0;padding:0"><div class="th"><img src="'+editImg+'" alt=""></div><button class="btn sm" data-act="rmImg">إزالة الصورة</button></div>':'';
}
function renderPList(){
  var ps=draft.products;
  $('#s1').textContent=ps.length; $('#s2').textContent=ps.filter(function(p){return p.available}).length; $('#s3').textContent=ps.filter(function(p){return !p.available}).length;
  var cs=[]; ps.forEach(function(p){if(p.category&&cs.indexOf(p.category)<0)cs.push(p.category)});
  $('#cats').innerHTML=cs.map(function(c){return '<option value="'+esc(c)+'">'}).join('');
  $('#plist').innerHTML=ps.length?ps.map(function(p){
    return '<div class="row"><div class="th">'+thumb(p)+'</div><div class="inf"><div class="nm">'+esc(p.name)+'</div><div class="mt">'+fmt(p.price)+(p.category?' · '+esc(p.category):'')+' · <span class="pill '+(p.available?'ok':'no')+'">'+(p.available?'متوفر':'نفد')+'</span></div>'+
    '<div class="acts"><button class="btn sm" data-act="edit" data-id="'+p.id+'">تعديل</button><button class="btn sm" data-act="toggle" data-id="'+p.id+'">'+(p.available?'تعيين كنفد':'تعيين كمتوفر')+'</button><button class="btn sm danger" data-act="del" data-id="'+p.id+'">'+(pendingDel===p.id?'اضغط للتأكيد':'حذف')+'</button></div></div></div>';
  }).join(''):'<div class="empty" style="border:0;padding:20px"><b>لا توجد منتجات بعد</b><span>أضف أول منتج من النموذج أعلاه.</span></div>';
}
function resetForm(){
  editId=null; editImg='';
  ['pName','pPrice','pCat','pDesc'].forEach(function(i){$('#'+i).value=''});
  $('#pAvail').checked=true; $('#pImg').value=''; $('#formTitle').textContent='إضافة منتج'; $('#saveP').textContent='إضافة المنتج'; $('#cancelP').hidden=true; renderImgPrev();
}
function saveProduct(){
  var m=$('#pmsg'); m.className='msg';
  var name=$('#pName').value.trim(), price=parseFloat($('#pPrice').value);
  if(!name){m.textContent='أدخل اسم المنتج.';$('#pName').focus();return}
  if(!(price>=0)){m.textContent='أدخل سعراً صحيحاً.';$('#pPrice').focus();return}
  var rec={name:name,price:price,category:$('#pCat').value.trim(),desc:$('#pDesc').value.trim(),available:$('#pAvail').checked,image:editImg};
  if(editId){var p=byId(draft.products,editId); if(p)Object.keys(rec).forEach(function(k){p[k]=rec[k]})}
  else{rec.id='p'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); draft.products.unshift(rec)}
  saveLocal(); resetForm(); renderPList(); m.className='msg ok'; m.textContent='تم الحفظ في المسودة. نزّل الملفات من قسم «نشر التغييرات» لتظهر للزبائن.';
}
function dl(name,text,type){
  var a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([text],{type:type+';charset=utf-8'})); a.download=name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(function(){URL.revokeObjectURL(a.href)},3000);
}
function site(){return String(draft.store.siteUrl||'').trim().replace(/\/+$/,'')}
function dmsg(t,ok){var m=$('#dmsg');m.className='msg'+(ok?' ok':'');m.textContent=t}
root.addEventListener('click',function(e){
  var t=e.target.closest('[data-act]'); if(!t) return;
  var act=t.getAttribute('data-act'), id=t.getAttribute('data-id');
  if(act==='saveP') saveProduct();
  else if(act==='cancelP') resetForm();
  else if(act==='rmImg'){editImg='';$('#pImg').value='';renderImgPrev()}
  else if(act==='edit'){
    var p=byId(draft.products,id); if(!p) return;
    editId=id; editImg=p.image||'';
    $('#pName').value=p.name; $('#pPrice').value=p.price; $('#pCat').value=p.category||''; $('#pDesc').value=p.desc||''; $('#pAvail').checked=!!p.available;
    $('#formTitle').textContent='تعديل منتج'; $('#saveP').textContent='حفظ التعديل'; $('#cancelP').hidden=false; renderImgPrev(); $('#pName').scrollIntoView({block:'center'}); $('#pName').focus();
  }
  else if(act==='toggle'){var q=byId(draft.products,id); if(q){q.available=!q.available;saveLocal();renderPList()}}
  else if(act==='del'){
    if(pendingDel===id){draft.products=draft.products.filter(function(x){return x.id!==id});pendingDel=null;if(editId===id)resetForm();saveLocal();renderPList()}
    else{pendingDel=id;renderPList();clearTimeout(delTimer);delTimer=setTimeout(function(){pendingDel=null;renderPList()},3000)}
  }
  else if(act==='dlIndex'){dl('index.html',buildStoreHTML(clone(draft),CSS,CLIENT),'text/html');dmsg('تم تنزيل index.html. نزّل data.json أيضاً.',true)}
  else if(act==='dlData'){dl('data.json',JSON.stringify(draft),'application/json');dmsg('تم تنزيل data.json.',true)}
  else if(act==='dlMap'){
    if(!site()){dmsg('أدخل عنوان الموقع في الإعدادات أولاً.');return}
    dl('sitemap.xml','<?xml version="1.0" encoding="UTF-8"?>\n<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9"><url><loc>'+esc(site())+'/</loc><lastmod>'+new Date().toISOString().slice(0,10)+'</lastmod></url></urlset>\n','application/xml');dmsg('تم تنزيل sitemap.xml.',true)
  }
  else if(act==='dlRobots'){
    dl('robots.txt','User-agent: *\nAllow: /\nDisallow: /admin.html\n'+(site()?'Sitemap: '+site()+'/sitemap.xml\n':''),'text/plain');dmsg('تم تنزيل robots.txt.',true)
  }
  else if(act==='reset'){try{localStorage.removeItem(KEY)}catch(x){} init()}
});
init();
})();
</script></body></html>
